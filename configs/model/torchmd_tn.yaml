model_type: torchmd_tn
hidden_dim: 128
num_layers: 3
# TorchMD-NET neighbor list
cutoff_radius: 30.0
max_num_neighbors: 65
neighbor_strategy: brute
# RBF distance encoding
num_rbf: 32
rbf_type: expnorm
trainable_rbf: true
# TensorNet specific
equivariance_invariance_group: "O(3)"
# Mobility head (predicts alpha/beta per edge)
mobility_hidden_dim: 128
