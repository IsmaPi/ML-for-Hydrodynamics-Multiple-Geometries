model_type: torchmd_et
hidden_dim: 128
num_layers: 2
# TorchMD-NET neighbor list
cutoff_radius: 30.0
max_num_neighbors: 128
neighbor_strategy: brute
# RBF distance encoding
num_rbf: 32
rbf_type: expnorm
trainable_rbf: true
# Equivariant Transformer attention
num_heads: 4
distance_influence: both
# Mobility head (predicts alpha/beta per edge)
mobility_hidden_dim: 64
