model_type: torchmd_gn
input_dim: 3                  # forces only (3D)
hidden_dim: 128
num_layers: 3
output_dim: 3
# TorchMD-NET neighbor list
cutoff_radius: 30.0
max_num_neighbors: 128
neighbor_strategy: brute
# RBF distance encoding
num_rbf: 32
rbf_type: expnorm
trainable_rbf: true
# Physics
hydrodynamic_radius: 1.0
